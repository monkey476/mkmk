<!-- Firebase SDK Modules Setup -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAe6_ODkyqxC4FmMvP4rdY5-lLKUyuv7UY",
            authDomain: "mkmk-618e7.firebaseapp.com",
            projectId: "mkmk-618e7",
            storageBucket: "mkmk-618e7.firebasestorage.app",
            messagingSenderId: "942857686875",
            appId: "1:942857686875:web:fb5fb7573319a69430d47e",
            measurementId: "G-8SJH9VZTYN",
            databaseURL: "https://mkmk-618e7-default-rtdb.europe-west1.firebasedatabase.app/"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let state = {
            mainPremierTop: [],
            userAccounts: [], // Tutaj przechowujemy poprawną listę kont
            topFaceit: "",
            topPkt: "",
            tournamentBracket: "",
            userClips: []
        };

        let streamerMode = false;
        let authMode = 'login';
        let captcha = '';

        onValue(ref(db, 'mkmk_data'), (snapshot) => {
            const data = snapshot.val();
            if (data) {
                state.mainPremierTop = data.mainPremierTop || [];
                
                // POPRAWKA: Bezpieczne parsowanie kont użytkowników niezależnie od formatu w Firebase
                state.userAccounts = [];
                if (data.userAccounts) {
                    Object.keys(data.userAccounts).forEach(key => {
                        state.userAccounts.push(data.userAccounts[key]);
                    });
                }
                
                state.topFaceit = data.topFaceit || "M____K|3 Level|(758)\nChysik|5 Level|(1200)";
                state.topPkt = data.topPkt || "Huzarjr|1 pkt\nmr.monkax|1 pkt";
                state.tournamentBracket = data.tournamentBracket || "Finał|MKMK vs TeamX|MKMK";
                state.userClips = data.userClips ? Object.values(data.userClips) : [];
            } else {
                const initial = {
                    mainPremierTop: [{nick:"pientaszek27",premier:4667,kd:"0.63",wr:"43%",mecze:14,adr:72},{nick:"Chysik",premier:3964,kd:"0.96",wr:"50%",mecze:21,adr:81}],
                    topFaceit: "M____K|3 Level|(758)\nChysik|5 Level|(1200)",
                    topPkt: "Huzarjr|1 pkt\nmr.monkax|1 pkt",
                    tournamentBracket: "Finał|MKMK vs TeamX|MKMK"
                };
                set(ref(db, 'mkmk_data'), initial);
            }
            renderAll();
            if(document.getElementById('adminPanelControls').style.display === 'block') {
                refreshAdminLists();
            }
        });

        function pushState() {
            set(ref(db, 'mkmk_data/mainPremierTop'), state.mainPremierTop);
            set(ref(db, 'mkmk_data/topFaceit'), state.topFaceit);
            set(ref(db, 'mkmk_data/topPkt'), state.topPkt);
            set(ref(db, 'mkmk_data/tournamentBracket'), state.tournamentBracket);
        }

        function switchTab(t, btn) {
            document.querySelectorAll('.tab-content').forEach(e=>e.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(e=>e.classList.remove('active'));
            document.getElementById(t).classList.add('active');
            btn.classList.add('active');
        }
        document.getElementById('btn-topki').onclick = (e) => switchTab('topki', e.target);
        document.getElementById('btn-turnieje').onclick = (e) => switchTab('turnieje', e.target);
        document.getElementById('btn-klipy').onclick = (e) => switchTab('klipy', e.target);

        document.getElementById('settingsTrigger').onclick = () => document.getElementById('settingsSidebar').classList.toggle('open');
        document.getElementById('closeSidebar').onclick = () => document.getElementById('settingsSidebar').classList.remove('open');
        document.getElementById('themeSelect').onchange = (e) => {
            document.body.className = ''; 
            if(e.target.value !== 'black') document.body.classList.add('theme-' + e.target.value);
        };
        document.getElementById('streamerToggle').onchange = (e) => {
            streamerMode = e.target.checked;
            renderAll();
        };

        function mask(n) { return streamerMode ? "[UKRYTE]" : n; }

        function generateCaptcha() {
            captcha = Math.random().toString(36).substring(2,6).toUpperCase();
            document.getElementById('captchaValue').innerText = captcha;
        }
        document.getElementById('refreshCaptcha').onclick = () => generateCaptcha();

        function openModal(id) {
            document.getElementById('modalOverlay').style.display = 'block';
            const m = document.getElementById(id);
            m.style.display = 'block';
            setTimeout(() => m.classList.add('open'), 10);
        }
        function closeModal(id) {
            const m = document.getElementById(id);
            m.classList.remove('open');
            setTimeout(() => { m.style.display = 'none'; document.getElementById('modalOverlay').style.display = 'none'; }, 200);
        }

        window.openLoginModal = () => { openModal('loginModal'); setAuthMode('login'); };
        document.getElementById('closeLoginBtn').onclick = () => closeModal('loginModal');
        document.getElementById('adminTriggerBtn').onclick = () => openModal('adminModal');
        document.getElementById('closeAdminBtn').onclick = () => closeModal('adminModal');
        document.getElementById('modalOverlay').onclick = () => { closeModal('loginModal'); closeModal('adminModal'); };

        function setAuthMode(m) {
            authMode = m; generateCaptcha();
            document.getElementById('uNick').value = '';
            document.getElementById('uPass').value = '';
            document.getElementById('uCaptchaInput').value = '';
            document.getElementById('subtabLogin').className = m==='login'?'active':'';
            document.getElementById('subtabRegister').className = m==='register'?'active':'';
            document.getElementById('authSubmitBtn').innerText = m==='login'?'Zaloguj się':'Zarejestruj się';
        }
        document.getElementById('subtabLogin').onclick = () => setAuthMode('login');
        document.getElementById('subtabRegister').onclick = () => setAuthMode('register');

        // POPRAWKA: Całkowicie nowy, stabilny system uwierzytelniania kont
        document.getElementById('authSubmitBtn').onclick = () => {
            const n = document.getElementById('uNick').value.trim(), p = document.getElementById('uPass').value, c = document.getElementById('uCaptchaInput').value.trim();
            if(!n || !p) return alert('Uzupełnij pola!');
            if(c.toUpperCase() !== captcha) return alert('Błędna CAPTCHA!');

            if(authMode==='login') {
                // Dokładne sprawdzenie loginu bez względu na wielkość liter
                let exist = state.userAccounts.find(a => a && a.username && a.username.toLowerCase() === n.toLowerCase());
                if(!exist || exist.pass !== p) return alert('Błędna nazwa użytkownika lub hasło!');
                localStorage.setItem('activeUser', exist.username);
                alert(`Witaj ponownie, ${exist.username}!`);
            } else {
                let exist = state.userAccounts.find(a => a && a.username && a.username.toLowerCase() === n.toLowerCase());
                if(exist) return alert('Ta nazwa użytkownika jest już zajęta!');
                
                const newAccRef = push(ref(db, 'mkmk_data/userAccounts'));
                const newUserData = {username: n, created: new Date().toISOString().split('T')[0], pass: p};
                
                set(newAccRef, newUserData);
                localStorage.setItem('activeUser', n);
                alert(`Konto ${n} zostało pomyślnie utworzone!`);
            }
            closeModal('loginModal'); updateAuthBar(); renderAll();
        };

        function updateAuthBar() {
            const u = localStorage.getItem('activeUser'), z = document.getElementById('authZone');
            if(u) {
                z.innerHTML = `<span>● ${u}</span><button class="btn-danger" id="logoutBtn">Wyloguj</button>`;
                document.getElementById('logoutBtn').onclick = () => { localStorage.removeItem('activeUser'); updateAuthBar(); renderAll(); };
                document.getElementById('clipFormContainer').style.display='flex'; document.getElementById('clipWarn').style.display='none';
            } else {
                z.innerHTML = `<button class="btn" onclick="openLoginModal()">Konto</button>`;
                document.getElementById('clipFormContainer').style.display='none'; document.getElementById('clipWarn').style.display='block';
            }
        }

        function renderAll() {
            const players = [...state.mainPremierTop].sort((a,b)=>b.premier-a.premier);
            const pod = document.getElementById('podiumContainer'); pod.innerHTML = '';
            const order = [{p:players[1],r:2,c:"p-2"},{p:players[0],r:1,c:"p-1"},{p:players[2],r:3,c:"p-3"}];
            order.forEach(i=>{ if(i.p) pod.innerHTML+=`<div class="podium-place ${i.c}"><div class="podium-badge">${i.r}</div><div class="podium-name">${mask(i.p.nick)}</div><div class="podium-score">${i.p.premier} mkmk</div></div>`; });

            const tb = document.getElementById('mainPremierTableBody'); tb.innerHTML = '';
            let m=0, kd=0;
            players.forEach((p, idx)=>{ m+=parseInt(p.mecze||0); kd+=parseFloat(p.kd||0); tb.innerHTML+=`<tr><td><span style="color:var(--text-color); margin-right:10px;">#${idx+1}</span> <b>${mask(p.nick)}</b></td><td><span class="premium-badge">${p.premier}</span></td><td>${p.kd}</td><td>${p.wr}</td><td>${p.mecze}</td><td style="color:var(--accent-color); font-weight:bold;">${p.adr}</td></tr>`; });
            document.getElementById('statsSummaryContainer').innerHTML = `<div class="summary-card"><div>Łączne Mecze</div><div>${m}</div></div><div class="summary-card"><div>Średni K/D</div><div>${(kd/(players.length||1)).toFixed(2)}</div></div><div class="summary-card"><div>Zarejestrowani</div><div>${players.length}</div></div>`;

            const fCont = document.getElementById('faceitListContainer'); fCont.innerHTML='';
            state.topFaceit.split('\n').forEach((row,idx)=>{ if(!row.trim())return; const pts=row.split('|'); fCont.innerHTML+=`<div class="leaderboard-item"><div>#0${idx+1} ${mask(pts[0])}</div><div><span class="premium-badge" style="border-color:transparent; background:rgba(255,255,255,0.05); color:#fff">${pts[1]||''}</span></div></div>`; });

            const pCont = document.getElementById('pktListContainer'); pCont.innerHTML='';
            state.topPkt.split('\n').forEach((row,idx)=>{ if(!row.trim())return; const pts=row.split('|'); pCont.innerHTML+=`<div class="leaderboard-item"><div>#0${idx+1} ${mask(pts[0])}</div><div style="color:var(--accent-color); font-weight:900;">${pts[1]||''}</div></div>`; });

            const bCont = document.getElementById('bracketContainer'); bCont.innerHTML='';
            state.tournamentBracket.split('\n').forEach(row=>{ if(!row.trim())return; const pts=row.split('|'); bCont.innerHTML+=`<div class="tournament-stage"><div class="stage-title">${pts[0]}</div><div class="match-row"><div>${pts[1]}</div><div class="match-winner">${pts[2]}</div></div></div>`; });

            const cCont = document.getElementById('clipsContainer'); cCont.innerHTML='';
            state.userClips.forEach(c=>{ cCont.innerHTML+=`<div class="clip-card"><b style="color:#fff; font-size:16px;">${c.name}</b><small style="color:var(--text-color)">Wysłane przez: ${mask(c.author)}</small><a href="${c.url}" target="_blank" class="btn" style="padding:8px 12px; text-align:center; margin-top:10px; font-size:11px; background:var(--accent-color)">Oglądaj Akcję</a></div>`; });
        }

        document.getElementById('adminAuthSubmit').onclick = () => {
            if(document.getElementById('adminPasswordInput').value === "MKMKCS2") {
                document.getElementById('adminLoginBlock').style.display='none'; 
                document.getElementById('adminPanelControls').style.display='block';
                document.getElementById('rawFaceitText').value = state.topFaceit;
                document.getElementById('rawPktText').value = state.topPkt;
                document.getElementById('rawBracketText').value = state.tournamentBracket;
                refreshAdminLists();
            } else alert('Błąd!');
        };

        function refreshAdminLists() {
            const pTb = document.getElementById('admPremierPlayersList'); pTb.innerHTML='';
            state.mainPremierTop.forEach((p,i)=>{ 
                pTb.innerHTML+=`<tr><td>${p.nick}</td><td>${p.premier}</td><td>${p.kd}</td><td>${p.wr}</td><td class="adm-actions-cell"><button class="btn-secondary" data-edit="${i}">Edytuj</button><button class="btn-danger" data-del="${i}">Usuń</button></td></tr>`; 
            });
            pTb.querySelectorAll('[data-edit]').forEach(b => b.onclick = (e) => loadPl(e.target.getAttribute('data-edit')));
            pTb.querySelectorAll('[data-del]').forEach(b => b.onclick = (e) => delPl(e.target.getAttribute('data-del')));

            const uTb = document.getElementById('admUsersList'); uTb.innerHTML='';
            state.userAccounts.forEach((u,i)=>{ 
                if(u && u.username) {
                    uTb.innerHTML+=`<tr><td>${u.username}</td><td>${u.created || 'Brak danych'}</td></tr>`; 
                }
            });
        }

        function loadPl(i) {
            const p = state.mainPremierTop[i];
            document.getElementById('admNick').value=p.nick; document.getElementById('admPremier').value=p.premier;
            document.getElementById('admKd').value=p.kd; document.getElementById('admWr').value=p.wr;
            document.getElementById('admMecze').value=p.mecze; document.getElementById('admAdr').value=p.adr;
        }
        function delPl(i) { 
            state.mainPremierTop.splice(i,1); 
            pushState();
        }

        document.getElementById('addPlayerBtn').onclick = () => {
            const n = document.getElementById('admNick').value.trim(), p = parseInt(document.getElementById('admPremier').value);
            if(!n || isNaN(p)) return alert('Wpisz nick i punkty!');
            state.mainPremierTop = state.mainPremierTop.filter(x=>x.nick.toLowerCase()!==n.toLowerCase());
            state.mainPremierTop.push({nick:n, premier:p, kd:document.getElementById('admKd').value||"1.0", wr:document.getElementById('admWr').value||"50%", mecze:document.getElementById('admMecze').value||0, adr:document.getElementById('admAdr').value||0});
            pushState();
        };

        document.getElementById('saveTextsBtn').onclick = () => {
            state.topFaceit = document.getElementById('rawFaceitText').value;
            state.topPkt = document.getElementById('rawPktText').value;
            state.tournamentBracket = document.getElementById('rawBracketText').value;
            pushState();
            closeModal('adminModal');
            alert('Zapisano w chmurze!');
        };

        document.getElementById('submitClipBtn').onclick = () => {
            const newClipRef = push(ref(db, 'mkmk_data/userClips'));
            set(newClipRef, {
                name: document.getElementById('cName').value,
                url: document.getElementById('cUrl').value,
                author: localStorage.getItem('activeUser') || "Anonim"
            });
            document.getElementById('cName').value = "";
            document.getElementById('cUrl').value = "";
            alert('Klip wysłany do bazy!');
        };

        updateAuthBar();
    </script>
</body>
</html>
