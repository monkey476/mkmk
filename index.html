<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>mkmk</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #273449;
      --primary: #14b8a6;
      --primary-hover: #0d9488;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    header { text-align: center; padding: 8px 0; }

    header h1 {
      font-size: 2rem;
      letter-spacing: -0.02em;
      background: linear-gradient(135deg, var(--primary), #5eead4);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    header p { color: var(--muted); font-size: 0.95rem; margin-top: 4px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .card h2 {
      font-size: 1.1rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    form { display: flex; gap: 10px; flex-wrap: wrap; }

    input[type="text"] {
      flex: 1 1 220px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input[type="text"]:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(20, 184, 166, 0.2);
    }

    button {
      background: var(--primary);
      color: #04221f;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      padding: 12px 22px;
      cursor: pointer;
      transition: background 0.15s, transform 0.05s;
    }

    button:hover { background: var(--primary-hover); }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    .status {
      font-size: 0.85rem;
      margin-top: 12px;
      min-height: 18px;
      color: var(--muted);
    }
    .status.error { color: #f87171; }
    .status.success { color: #34d399; }

    ul { list-style: none; display: flex; flex-direction: column; gap: 10px; }

    li {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.95rem;
      word-break: break-word;
      animation: fadeIn 0.25s ease;
    }

    li .time { display: block; color: var(--muted); font-size: 0.75rem; margin-top: 4px; }

    .empty { color: var(--muted); font-style: italic; text-align: center; padding: 12px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-4px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>mkmk</h1>
      <p>Zapisuj i odczytuj dane w czasie rzeczywistym</p>
    </header>

    <section class="card">
      <h2>Dodaj wpis</h2>
      <form id="dataForm">
        <input type="text" id="textInput" placeholder="Wpisz tekst..." autocomplete="off" required />
        <button type="submit" id="saveBtn">Zapisz</button>
      </form>
      <div class="status" id="status"></div>
    </section>

    <section class="card">
      <h2>Zapisane dane</h2>
      <ul id="dataList">
        <li class="empty">Ładowanie danych...</li>
      </ul>
    </section>
  </div>

  <script type="module">
    // --- Importy modułowego SDK Firebase (v10+) ---
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import {
      getDatabase,
      ref,
      push,
      onValue
    } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";

    // --- Konfiguracja Firebase ---
    // Wklej tutaj swoje klucze z panelu Firebase (Ustawienia projektu > Twoje aplikacje).
    const firebaseConfig = {
      apiKey: "TWÓJ_API_KEY",
      authDomain: "TWÓJ_AUTH_DOMAIN",
      databaseURL: "TWÓJ_DATABASE_URL", // np. https://twoj-projekt-default-rtdb.europe-west1.firebasedatabase.app
      projectId: "TWÓJ_PROJECT_ID",
      storageBucket: "TWÓJ_STORAGE_BUCKET",
      messagingSenderId: "TWÓJ_MESSAGING_SENDER_ID",
      appId: "TWÓJ_APP_ID"
    };

    // --- Inicjalizacja ---
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dataRef = ref(db, "mkmk_dane");

    // --- Elementy DOM ---
    const form = document.getElementById("dataForm");
    const input = document.getElementById("textInput");
    const saveBtn = document.getElementById("saveBtn");
    const statusEl = document.getElementById("status");
    const list = document.getElementById("dataList");

    function setStatus(message, type = "") {
      statusEl.textContent = message;
      statusEl.className = "status" + (type ? " " + type : "");
    }

    // --- Zapis danych do węzła 'mkmk_dane' ---
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;

      saveBtn.disabled = true;
      setStatus("Zapisywanie...");

      try {
        await push(dataRef, {
          text: text,
          createdAt: Date.now()
        });
        input.value = "";
        setStatus("Zapisano pomyślnie!", "success");
      } catch (err) {
        console.error("[mkmk] Błąd zapisu:", err);
        setStatus("Błąd zapisu: " + (err?.message || err), "error");
      } finally {
        saveBtn.disabled = false;
        input.focus();
      }
    });

    // --- Odczyt w czasie rzeczywistym ---
    onValue(
      dataRef,
      (snapshot) => {
        const data = snapshot.val();
        list.innerHTML = "";

        if (!data) {
          const li = document.createElement("li");
          li.className = "empty";
          li.textContent = "Brak danych. Dodaj pierwszy wpis!";
          list.appendChild(li);
          return;
        }

        // Zamieniamy obiekt na tablicę i sortujemy od najnowszych
        const entries = Object.entries(data).map(([key, value]) => ({ key, ...value }));
        entries.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        for (const entry of entries) {
          const li = document.createElement("li");

          const span = document.createElement("span");
          span.textContent = entry.text ?? "(brak tekstu)";
          li.appendChild(span);

          if (entry.createdAt) {
            const time = document.createElement("span");
            time.className = "time";
            time.textContent = new Date(entry.createdAt).toLocaleString("pl-PL");
            li.appendChild(time);
          }

          list.appendChild(li);
        }
      },
      (err) => {
        // Obsługa błędów (np. zablokowany odczyt przez reguły bezpieczeństwa)
        console.error("[mkmk] Błąd odczytu:", err);
        list.innerHTML = "";
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = "Nie udało się pobrać danych: " + (err?.message || err);
        list.appendChild(li);
      }
    );
  </script>
</body>
</html>
